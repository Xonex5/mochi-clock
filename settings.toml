# Chrono: Clock, Stopwatch, and Countdown Timer for Mochi.
# Copy this section into ~/.config/mochi/config.toml under [module.chrono].

[module.chrono]
# Default timer duration in minutes when started without arguments.
# default_timer_minutes = 5

# Clock time format ("%H:%M:%S", "%H:%M", etc.).
# clock_format = "%H:%M:%S"

# 24-hour clock mode (true) or 12-hour AM/PM (false).
# clock_24h = true

# Area next to the island for the bubble: "CenterRight", "CenterLeft", "Right", "Left".
# area = "CenterRight"

# Show a bubble on the island when a timer is running or paused.
# timer_bubble = true

# Show a bubble on the island when the stopwatch is running.
# stopwatch_bubble = true

# Play an audio alert sound when the timer finishes.
# sound = true
