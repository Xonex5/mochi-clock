[plugin]
id = "chrono"
name = "Clock"
version = "0.1.0"
description = "All-in-one clock, stopwatch, and timer for Mochi"
authors = ["xo"]
api = 1

[backend]
exec = "bin/chrono"
build = "cargo build --release --target-dir target && install -Dm755 target/release/chrono bin/chrono"

[release]
asset = "chrono-{version}-{arch}-linux.tar.gz"

[[actions]]
name = "status"
description = "Show the status of the clock, stopwatch, and timer"

[[actions]]
name = "mode"
description = "Switch active view mode (clock, stopwatch, timer)"
args = [
    { name = "mode", description = "View mode to display", kind = "choice", choices = ["clock", "stopwatch", "timer"], optional = false }
]

[[actions]]
name = "timer_start"
description = "Start the countdown timer with a duration"
args = [
    { name = "duration", description = "Duration (e.g. 10m, 90s, 1h 30m, 05:00, or minutes)", kind = "string", optional = true }
]

[[actions]]
name = "timer_pause"
description = "Pause or resume the countdown timer"

[[actions]]
name = "timer_stop"
description = "Stop and reset the countdown timer"

[[actions]]
name = "timer_add"
description = "Add time to the timer"
args = [
    { name = "duration", description = "Duration to add (e.g. 1m, 5m, 30s)", kind = "string", optional = false }
]

[[actions]]
name = "stopwatch_start"
description = "Start the stopwatch"

[[actions]]
name = "stopwatch_pause"
description = "Pause or resume the stopwatch"

[[actions]]
name = "stopwatch_reset"
description = "Stop and reset the stopwatch"

[[actions]]
name = "stopwatch_lap"
description = "Record a lap on the stopwatch"

[[contributions]]
target = "hub"
kind = "card"
id = "chrono"
view = "Card"
title = "Clock"
icon = "clock"
order = 65
options = { span = 2 }

[[contributions]]
target = "hub"
kind = "page"
id = "chrono"
view = "Page"
title = "Clock"
icon = "clock"

[[contributions]]
target = "widgets"
kind = "widget"
id = "chrono"
view = "Card"
title = "Clock"
options = { size = [18, 9], min = [14, 7], max = [36, 16] }
